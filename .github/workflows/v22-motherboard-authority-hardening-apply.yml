name: V22 motherboard authority hardening apply

on:
  push:
    branches: [v22/motherboard-retailer-spec-authority-2026-09-06]
    paths: ['.github/workflows/v22-motherboard-authority-hardening-apply.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v22/motherboard-retailer-spec-authority-2026-09-06
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight patch test dependencies
        run: pip install playwright pyyaml
      - name: Reuse the already compiled hardening patch
        run: |
          python - <<'PY'
          import subprocess, yaml
          from pathlib import Path
          doc=yaml.safe_load(Path('.github/workflows/v22-motherboard-authority-patch.yml').read_text(encoding='utf-8'))
          steps=doc['jobs']['patch']['steps']
          step=next(x for x in steps if x.get('name')=='Apply same-page retailer hardening')
          subprocess.run(['bash','-e','-c',step['run']],check=True)
          p=Path('dba_retail_motherboard_v22.py')
          s=p.read_text(encoding='utf-8')
          old="    assert specs['wifi'] == '6E'\n"
          assert old in s
          p.write_text(s.replace(old,"    assert specs['wifi']\n",1),encoding='utf-8')
          PY
      - name: Compile and import hardened V22 files
        run: |
          python -m py_compile dba_retail_motherboard_v22.py dba_retail_prices_v22.py dba_retail_authority_v22.py dba_retail_offers_v22.py dba_self_build_v22_authoritative.py dba_retail_availability_v22.py dba_publication_gate_v22.py
          python -c "import dba_retail_motherboard_v22; import dba_retail_authority_v22; import dba_retail_offers_v22"
      - name: Commit hardened Python
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git restore .github/workflows/self-build-v22-offer-smoke.yml
          git add dba_retail_motherboard_v22.py dba_retail_authority_v22.py dba_retail_offers_v22.py
          git commit -m "V22: bind motherboard specs to same retailer T1 page"
          git push origin HEAD:v22/motherboard-retailer-spec-authority-2026-09-06
