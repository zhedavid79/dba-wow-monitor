name: V22 spec control probe

on:
  push:
    branches: [v22/spec-control-probe-2026-09-06]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Inspect expanded specification block
        run: |
          python - <<'PY'
          import asyncio, re
          from playwright.async_api import async_playwright

          URL='https://prisjagt.dk/product.php?p=14363692'
          LABELS=('Hukommelsespladser','M.2','Maks. Ethernet-hastighed','Trådløst netværk (Wi-Fi)')

          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  c=await b.new_context(locale='da-DK')
                  page=await c.new_page()
                  r=await page.goto(URL,wait_until='domcontentloaded',timeout=45000)
                  print('HTTP',r.status if r else None)
                  before=await page.locator('body').text_content() or ''
                  print('BEFORE',{x:(x.lower() in before.lower()) for x in LABELS})
                  expand=page.get_by_role('button',name=re.compile(r'^Se mere information$',re.I))
                  print('EXPAND_COUNT',await expand.count())
                  if await expand.count():
                      item=expand.first
                      print('EXPAND_VISIBLE',await item.is_visible())
                      await item.click(timeout=4000)
                      try:
                          await page.get_by_text(re.compile(r'Maks\.?\s*Ethernet[- ]?hastighed',re.I)).first.wait_for(state='attached',timeout=5000)
                      except Exception as e:
                          print('WAIT_ERR',type(e).__name__)
                  after=await page.locator('body').text_content() or ''
                  print('AFTER',{x:(x.lower() in after.lower()) for x in LABELS})
                  for label in LABELS:
                      start=0; seen=0
                      while True:
                          pos=after.lower().find(label.lower(),start)
                          if pos<0 or seen>=3: break
                          print('CONTEXT',label,repr(after[max(0,pos-140):pos+420]))
                          start=pos+len(label); seen+=1
                  await c.close(); await b.close()
          asyncio.run(main())
          PY
