name: WoW DBA Component Recovery Smoke

on:
  push:
    branches: [main]
    paths:
      - 'dba_z20_parts.py'
      - 'dba_z20_parts_recovery.py'
      - 'dba_strategy_parts.py'
      - '.github/workflows/parts-recovery-smoke.yml'

permissions:
  contents: read

concurrency:
  group: wow-dba-component-recovery-smoke
  cancel-in-progress: true

jobs:
  parts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Compile recovery path
        run: python -m py_compile dba_z20_parts.py dba_z20_parts_recovery.py dba_strategy_parts.py
      - name: Run focused component discovery and T1 gate
        run: python dba_strategy_parts.py
      - name: Validate focused component gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('results/z20_parts_latest.json').read_text(encoding='utf-8'))
          coverage=p.get('coverage') or {}
          d=coverage.get('discovery') or {}
          t=coverage.get('t1') or {}
          assert p.get('gate_passed') is True, p.get('gate_passed')
          assert d.get('complete') is True, d
          assert not d.get('missing_queries'), d
          assert d.get('query_completed') == d.get('query_total'), d
          assert t.get('complete') is True, t
          assert not t.get('missing_listing_ids'), t
          assert t.get('candidate_completed') == t.get('candidate_total'), t
          assert t.get('candidate_fetch_errors') == 0, t
          print({
              'PASS': True,
              'parts': p.get('count'),
              'query_total': d.get('query_total'),
              'primary_completed': d.get('primary_completed_queries'),
              'recovered': len(d.get('recovered_queries') or []),
              'long_tail_recovered': len(d.get('long_tail_recovered_queries') or []),
              't1_completed': t.get('candidate_completed'),
              't1_errors': t.get('candidate_fetch_errors'),
              'fallback_concurrency': d.get('fallback_concurrency'),
          })
          PY
