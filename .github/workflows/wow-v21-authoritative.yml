name: WoW DBA Authoritative V21

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dba_known_listing_issues_v21.json'
      - 'dba_retail_availability_v21.py'
      - 'dba_procurement_v21.py'
      - 'dba_strategy_report_v21.py'
      - 'dba_publication_gate_v21.py'
      - '.github/workflows/wow-v21-authoritative.yml'

permissions:
  contents: write

concurrency:
  group: wow-dba-authoritative-v21
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preserve previous V20 publication and V19 golden baseline
        run: |
          cp results/wow_strategy_latest.json /tmp/previous_strategy.json
          git fetch origin baseline/v19-green-2026-09-05 --depth=1
          git show FETCH_HEAD:results/wow_strategy_latest.json > /tmp/v19_baseline_strategy.json

      - name: Install browser dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Compile V20 core and V21 procurement layer
        run: |
          python -m py_compile \
            dba_browser_v2.py dba_browser_v3.py dba_browser_v4.py dba_browser_v5.py \
            dba_browser_v6.py dba_browser_v6_recovery.py dba_browser_v7_intelligence.py dba_browser_v20.py \
            dba_listing_intelligence.py dba_decision_report.py dba_t1_preflight.py dba_t1_schema_probe.py dba_t1_hydration_ancestor.py \
            dba_z20_parts.py dba_z20_parts_recovery.py dba_strategy_parts.py dba_strategy_parts_v20.py \
            dba_z20_donors.py dba_z20_donors_recovery.py z20_complete_optimizer.py dba_strategy_optimizer.py \
            dba_platform_first_v16.py dba_platform_first_v20.py dba_self_build_v17.py dba_build_alternatives.py dba_self_build_v18.py \
            dba_component_optimizer_v19.py dba_component_market_v19.py dba_gpu_model_v20.py dba_route_pipeline_v20.py \
            dba_retail_prices_v20.py dba_self_build_v20.py dba_self_build_v20_authoritative.py \
            dba_strategy_report_v19.py dba_strategy_report_v20.py dba_publication_gate_v20.py dba_publication_gate_v20_authoritative.py \
            dba_retail_availability_v21.py dba_procurement_v21.py dba_strategy_report_v21.py dba_publication_gate_v21.py \
            dba_compact_publish_v20.py

      - name: Diagnose DBA source/schema gate
        timeout-minutes: 3
        run: python dba_t1_preflight.py

      - name: Scan complete used PCs and build same-run T1 cache
        timeout-minutes: 18
        run: python dba_browser_v20.py

      - name: Prepare complete-PC market reference and bid data
        run: python dba_decision_report.py

      - name: Scan used components with V20 RAM/GPU coverage and cache reuse
        timeout-minutes: 18
        run: python dba_strategy_parts_v20.py

      - name: Resolve complete-PC donor routes
        timeout-minutes: 4
        run: python dba_z20_donors_recovery.py

      - name: Build route universe with reserved GPU families
        timeout-minutes: 4
        run: python dba_route_pipeline_v20.py

      - name: Verify and dynamically discover retail market
        timeout-minutes: 7
        run: python dba_retail_prices_v20.py

      - name: Apply authoritative V20 performance and bid model
        run: python dba_self_build_v20_authoritative.py

      - name: Generate V20 core audit report
        run: python dba_strategy_report_v20.py

      - name: Validate V20 core publication gate before V21 transformation
        run: python dba_publication_gate_v20_authoritative.py

      - name: Verify selected retail availability to concrete-store level
        timeout-minutes: 5
        run: python dba_retail_availability_v21.py

      - name: Build V21 actionable procurement plan
        env:
          V21_PREVIOUS_STRATEGY: /tmp/previous_strategy.json
          V21_BASELINE_STRATEGY: /tmp/v19_baseline_strategy.json
        run: python dba_procurement_v21.py

      - name: Generate authoritative V21 procurement report
        run: python dba_strategy_report_v21.py

      - name: Validate authoritative V21 publication gate
        run: python dba_publication_gate_v21.py

      - name: Preserve gated V21 snapshot
        uses: actions/upload-artifact@v4
        with:
          name: wow-v21-gated-${{ github.run_id }}
          retention-days: 3
          compression-level: 6
          path: |
            results/wow_a3_latest.json
            results/wow_a3_report.md
            results/wow_platform_first_report.md
            results/wow_self_build_report.md
            results/wow_self_build_report_v20.md
            results/wow_self_build_report_v21.md
            results/wow_strategy_latest.json
            results/procurement_plan_v21.json
            results/retail_availability_v21.json
            results/retail_prices_latest.json
            results/retail_discovery_v20.json
            results/z20_parts_latest.json
            results/z20_donors_latest.json
            results/t1_cache_v20.json

      - name: Compact verified strategy snapshot
        run: python dba_compact_publish_v20.py

      - name: Validate publish payload size
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('results/wow_strategy_latest.json')
          size=p.stat().st_size
          limit=90*1024*1024
          assert size < limit, f'Compact V21 strategy snapshot too large: {size/1024/1024:.2f} MiB'
          print(f'PASS PUBLISH SIZE: {size/1024/1024:.2f} MiB < 90 MiB')
          PY

      - name: Publish authoritative V21 results
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/wow-v21-results
          cp \
            results/wow_a3_latest.json \
            results/wow_a3_report.md \
            results/wow_platform_first_report.md \
            results/wow_self_build_report.md \
            results/wow_self_build_report_v20.md \
            results/wow_self_build_report_v21.md \
            results/wow_strategy_latest.json \
            results/procurement_plan_v21.json \
            results/retail_availability_v21.json \
            results/retail_prices_latest.json \
            results/retail_discovery_v20.json \
            results/z20_parts_latest.json \
            results/z20_donors_latest.json \
            /tmp/wow-v21-results/
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/wow-v21-results/* results/
            git add \
              results/wow_a3_latest.json \
              results/wow_a3_report.md \
              results/wow_platform_first_report.md \
              results/wow_self_build_report.md \
              results/wow_self_build_report_v20.md \
              results/wow_self_build_report_v21.md \
              results/wow_strategy_latest.json \
              results/procurement_plan_v21.json \
              results/retail_availability_v21.json \
              results/retail_prices_latest.json \
              results/retail_discovery_v20.json \
              results/z20_parts_latest.json \
              results/z20_donors_latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update verified WoW V21 procurement report [skip ci]"
            if git push origin main; then exit 0; fi
          done
          exit 1
