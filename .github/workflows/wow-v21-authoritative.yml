name: WoW DBA V21 Manual Procurement Regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate published V21 procurement artifacts without publishing
        run: |
          python -m py_compile dba_procurement_v21.py dba_strategy_report_v21.py dba_publication_gate_v21.py
          python - <<'PY'
          from pathlib import Path
          p=Path('results/wow_self_build_report_v21.md')
          assert p.exists()
          text=p.read_text(encoding='utf-8')
          assert 'Hvad skal jeg gøre i dag?' in text
          assert 'Selvbyg-ranking — unikke BOM' in text
          assert 'Historiske hard exclusions' in text
          print('PASS V21 PUBLISHED PROCUREMENT REGRESSION')
          PY
      - name: No publication
        run: echo 'V21 is manual/read-only. V22 owns scheduled publication.'
