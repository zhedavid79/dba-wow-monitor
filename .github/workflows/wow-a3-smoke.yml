name: DBA Browser Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dba_browser_smoke.py'
      - '.github/workflows/wow-a3-smoke.yml'
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install playwright
          playwright install --with-deps chromium
      - run: python dba_browser_smoke.py
      - name: Publish smoke diagnostic
        if: always()
        run: |
          if [ -f results/dba_smoke.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add results/dba_smoke.json
            git commit -m "Update DBA browser smoke [skip ci]" || exit 0
            git pull --rebase origin main
            git push origin main
          fi
