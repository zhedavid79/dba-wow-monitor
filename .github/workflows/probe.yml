name: DBA Verified Report

on:
  push:
    branches: [main]
    paths-ignore:
      - 'acurast_dba_report.py'
      - 'acurast_listing_quality.py'
      - 'acurast_valuation.py'
      - 'acurastbot_probe.py'
      - '.github/workflows/acurast-dba.yml'
      - 'results/acurast_latest.json'
      - 'results/acurast_report.md'
      - 'results/acurast_valuation.json'
      - 'results/acurast_valuation.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Build verified WoW price report v9
        run: python dba_report_v9.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/latest_v6.json results/report_v6.md results/report_v9.md
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Update verified DBA WoW report [skip ci]"
            git push
          fi
