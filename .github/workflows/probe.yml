name: DBA Verified Report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Run structured-data regression probe
        run: python dba_probe.py
      - name: Build verified WoW price report v2
        run: python dba_report_v2.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/latest.json results/latest_v2.json results/report_v2.md
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Update verified DBA report v2 [skip ci]"
            git push
          fi
