name: V22 motherboard authority integration patch

on:
  push:
    branches: [v22/motherboard-retailer-spec-authority-2026-09-06]
    paths:
      - '.github/workflows/v22-motherboard-authority-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v22/motherboard-retailer-spec-authority-2026-09-06
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply same-page retailer hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              assert old in s, f'patch anchor missing: {path}: {old[:120]!r}'
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Let an optional component verifier inspect the *same* already-authorized
          # retailer page before it is closed. This avoids a second request being
          # independently blocked and binds price + specs to one T1 page instance.
          rep('dba_retail_authority_v22.py',
              "    *,\n    lead_price_dkk: int | None = None,\n) -> dict:\n",
              "    *,\n    lead_price_dkk: int | None = None,\n    component_page_verifier=None,\n) -> dict:\n")
          rep('dba_retail_authority_v22.py',
              "        result['retailer_page_verified'] = True\n        result['external_resolved'] = True\n        result['retailer_authority'] = 'DIRECT_RETAILER_T1'\n        return result\n",
              "        if component_page_verifier is not None:\n            try:\n                extra = await component_page_verifier(page, final_url, title, h1)\n                if isinstance(extra, dict):\n                    result.update(extra)\n            except Exception as exc:\n                result['component_page_verifier_error'] = f'{type(exc).__name__}: {str(exc)[:200]}'\n\n        result['retailer_page_verified'] = True\n        result['external_resolved'] = True\n        result['retailer_authority'] = 'DIRECT_RETAILER_T1'\n        return result\n")

          # Component hard specs: product-bound identity supplies AM5/mATX/DDR5/Wi-Fi;
          # detailed page evidence supplies DIMM/M.2/LAN. 5/10GbE correctly satisfy >=2.5.
          rep('dba_retail_motherboard_v22.py',
              "LAN_25_RE = re.compile(\n    r'\\b(?:2[,.]5\\s*(?:Gbit/s|Gbps|GbE|Gigabit(?:\\s+Ethernet|\\s+LAN)?|G\\s*LAN)|'\n    r'2500\\s*(?:Mbit/s|Mbps))\\b',\n    re.I,\n)\n",
              "LAN_G_RE = re.compile(\n    r'\\b(2[,.]5|5|10)\\s*(?:Gbit/s|Gbps|GbE|Gigabit(?:\\s+Ethernet|\\s+LAN)?|G\\s*LAN)\\b',\n    re.I,\n)\nLAN_M_RE = re.compile(r'\\b(2500|5000|10000)\\s*(?:Mbit/s|Mbps)\\b', re.I)\n")
          rep('dba_retail_motherboard_v22.py',
              "def extract_retailer_motherboard_specs(expected_name: str, page_text: str) -> dict:\n",
              "def _lan_gbps(text: str) -> float:\n    m = LAN_G_RE.search(str(text or ''))\n    if m:\n        return float(m.group(1).replace(',', '.'))\n    m = LAN_M_RE.search(str(text or ''))\n    if m:\n        return float(m.group(1)) / 1000.0\n    return 0.0\n\n\ndef extract_retailer_motherboard_specs(\n    expected_name: str,\n    page_text: str,\n    product_identity_text: str | None = None,\n) -> dict:\n")
          rep('dba_retail_motherboard_v22.py',
              "    text = str(page_text or '')\n    model_ok = bool(MODEL_RE.search(str(expected_name or '')))\n    matx = bool(MATX_RE.search(text))\n    am5 = bool(AM5_RE.search(text))\n    ddr5 = bool(DDR5_RE.search(text))\n\n    if WIFI7_RE.search(text):\n        wifi = '7'\n    elif WIFI6E_RE.search(text):\n        wifi = '6E'\n    elif WIFI6_RE.search(text):\n        wifi = '6'\n    elif WIFI_ANY_RE.search(text):\n        wifi = 'YES'\n",
              "    text = str(page_text or '')\n    identity = str(product_identity_text or '')\n    model_ok = bool(MODEL_RE.search(str(expected_name or '')))\n    # These identity-level facts must belong to the retailer's exact product\n    # title/H1, never to recommendations elsewhere on the page.\n    matx = bool(MATX_RE.search(identity))\n    am5 = bool(AM5_RE.search(identity))\n    ddr5 = bool(DDR5_RE.search(identity))\n\n    if WIFI7_RE.search(identity):\n        wifi = '7'\n    elif WIFI6E_RE.search(identity):\n        wifi = '6E'\n    elif WIFI6_RE.search(identity):\n        wifi = '6'\n    elif WIFI_ANY_RE.search(identity):\n        wifi = 'YES'\n")
          rep('dba_retail_motherboard_v22.py',
              "    lan = 2.5 if LAN_25_RE.search(text) else 0.0\n",
              "    lan = _lan_gbps(text)\n")

          # Add an on-page verifier used by the direct retailer authority callback.
          marker = "async def verify_retailer_motherboard_specs(context, direct_url: str, expected_name: str) -> dict:\n"
          addition = '''async def verify_retailer_motherboard_specs_on_page(\n    page,\n    direct_url: str,\n    expected_name: str,\n    title: str | None = None,\n    h1: str | None = None,\n) -> dict:\n    result = {\n        'retailer_component_spec_gate_passed': False,\n        'retailer_component_spec_authority': 'UNPROVEN',\n        'retailer_component_specs': None,\n        'retailer_component_spec_url': None,\n    }\n    final_url = str(getattr(page, 'url', '') or direct_url or '')\n    host = urlparse(final_url).netloc.lower().removeprefix('www.')\n    if not host or 'prisjagt.dk' in host:\n        result['retailer_component_spec_error'] = 'NO_EXTERNAL_RETAILER_URL'\n        return result\n    if title is None:\n        title = await page.title()\n    if h1 is None:\n        try:\n            h1 = (await page.locator('h1').first.inner_text(timeout=2500)).strip()\n        except Exception:\n            h1 = ''\n    identity_text = ' '.join([str(title or ''), str(h1 or '')])\n    if not retail_auth._same_product_identity(expected_name, identity_text):\n        result['retailer_component_spec_error'] = 'RETAILER_SPEC_PRODUCT_IDENTITY_UNPROVEN'\n        return result\n    try:\n        visible = await page.locator('body').inner_text(timeout=7000)\n    except Exception:\n        visible = ''\n    try:\n        dom_text = await page.locator('body').text_content(timeout=7000) or ''\n    except Exception:\n        dom_text = ''\n    evidence = (visible + '\\n' + dom_text)[:220000]\n    specs = extract_retailer_motherboard_specs(expected_name, evidence, identity_text)\n    result.update({\n        'retailer_component_spec_gate_passed': specs['passed'],\n        'retailer_component_spec_authority': (\n            'DIRECT_RETAILER_PRODUCT_PAGE_T1' if specs['passed'] else 'UNPROVEN'\n        ),\n        'retailer_component_specs': specs,\n        'retailer_component_spec_url': final_url,\n    })\n    if not specs['passed']:\n        result['retailer_component_spec_error'] = 'MOTHERBOARD_HARD_SPECS_UNPROVEN:' + ','.join(specs['missing'])\n    return result\n\n\n'''
          p=Path('dba_retail_motherboard_v22.py'); s=p.read_text(encoding='utf-8')
          assert marker in s
          p.write_text(s.replace(marker, addition+marker, 1), encoding='utf-8')

          # Existing standalone verifier also uses product-bound identity.
          rep('dba_retail_motherboard_v22.py',
              "        specs = extract_retailer_motherboard_specs(expected_name, evidence)\n",
              "        specs = extract_retailer_motherboard_specs(expected_name, evidence, identity_text)\n")

          # Strengthen regressions: direct identity is required and 5GbE passes.
          rep('dba_retail_motherboard_v22.py',
              "    specs = extract_retailer_motherboard_specs('ASRock B850M Pro RS WiFi', sample)\n",
              "    identity = 'ASRock B850M Pro RS WiFi Motherboard AMD B850 AMD AM5 DDR5 RAM Micro-ATX'\n    specs = extract_retailer_motherboard_specs('ASRock B850M Pro RS WiFi', sample, identity)\n")
          rep('dba_retail_motherboard_v22.py',
              "    weak_specs = extract_retailer_motherboard_specs('ASRock B850M Pro RS WiFi', weak)\n    assert weak_specs['passed'] is False\n    assert '4 DIMM' in weak_specs['missing']\n",
              "    weak_specs = extract_retailer_motherboard_specs('ASRock B850M Pro RS WiFi', weak, identity)\n    assert weak_specs['passed'] is False\n    assert '4 DIMM' in weak_specs['missing']\n\n    five_g = sample.replace('2.5 Gigabit Ethernet', '5 Gigabit Ethernet')\n    five_specs = extract_retailer_motherboard_specs('ASRock B850M Pro RS WiFi', five_g, identity)\n    assert five_specs['passed'] is True and five_specs['lan_gbps'] == 5.0, five_specs\n\n    no_wifi_identity = 'ASRock B850M Pro RS Motherboard AMD B850 AMD AM5 DDR5 RAM Micro-ATX'\n    no_wifi = extract_retailer_motherboard_specs('ASRock B850M Pro RS', sample, no_wifi_identity)\n    assert no_wifi['passed'] is False and 'Wi-Fi' in no_wifi['missing'], no_wifi\n")

          # Offers: ask authority to run the component check on the same page, no second navigation.
          old = """                    retailer = await authority22.verify_external_retailer(\n                        context,\n                        str(r['direct_url']),\n                        name,\n                        lead_price_dkk=int(r['displayed_price_dkk']),\n                    )\n                    r.update(retailer)\n                    if (\n                        out.get('kind') == 'MOTHERBOARD'\n                        and r.get('external_resolved') is True\n                        and r.get('retailer_url')\n                    ):\n                        r.update(await mb22.verify_retailer_motherboard_specs(\n                            context, str(r['retailer_url']), name\n                        ))\n"""
          new = """                    component_verifier = None\n                    if out.get('kind') == 'MOTHERBOARD':\n                        async def component_verifier(retailer_page, retailer_url, retailer_title, retailer_h1):\n                            return await mb22.verify_retailer_motherboard_specs_on_page(\n                                retailer_page, retailer_url, name, retailer_title, retailer_h1\n                            )\n                    retailer = await authority22.verify_external_retailer(\n                        context,\n                        str(r['direct_url']),\n                        name,\n                        lead_price_dkk=int(r['displayed_price_dkk']),\n                        component_page_verifier=component_verifier,\n                    )\n                    r.update(retailer)\n"""
          rep('dba_retail_offers_v22.py', old, new)

          # Spec leads are high-value coverage targets. Inspect them before the wider
          # catalog, and retry failed leads sequentially once after the first pass.
          rep('dba_retail_offers_v22.py',
              "        sem = asyncio.Semaphore(5)\n        rows = await asyncio.gather(*(inspect(context, p, sem, kmap) for p in products))\n        await context.close()\n",
              "        products.sort(key=lambda p: (0 if p.get('motherboard_spec_lead_v22') is True else 1))\n        sem = asyncio.Semaphore(4)\n        rows = await asyncio.gather(*(inspect(context, p, sem, kmap) for p in products))\n\n        row_pos = {str(r.get('sku') or ''): i for i, r in enumerate(rows)}\n        spec_lead_retries = 0\n        serial_sem = asyncio.Semaphore(1)\n        for p in products:\n            if p.get('motherboard_spec_lead_v22') is not True:\n                continue\n            pos = row_pos.get(str(p.get('sku') or ''))\n            if pos is None:\n                continue\n            current = rows[pos]\n            if (\n                current.get('delivered_price_verified') is True\n                and current.get('retailer_component_spec_gate_passed') is True\n            ):\n                continue\n            retry = await inspect(context, p, serial_sem, kmap)\n            spec_lead_retries += 1\n            if (\n                retry.get('delivered_price_verified') is True\n                or (\n                    current.get('retail_lead_price_dkk') is None\n                    and retry.get('retail_lead_price_dkk') is not None\n                )\n            ):\n                rows[pos] = retry\n        await context.close()\n")
          rep('dba_retail_offers_v22.py',
              "        'retailer_pages_verified': retailer_verified,\n        'rows': rows,\n",
              "        'retailer_pages_verified': retailer_verified,\n        'motherboard_spec_lead_retries': locals().get('spec_lead_retries', 0),\n        'rows': rows,\n")
          rep('dba_retail_offers_v22.py',
              "        'retailer_pages_verified': retailer_verified,\n        'required_price_basis': 'DIRECT_RETAILER_PAGE_ONLY',\n",
              "        'retailer_pages_verified': retailer_verified,\n        'motherboard_spec_lead_retries': result.get('motherboard_spec_lead_retries', 0),\n        'required_price_basis': 'DIRECT_RETAILER_PAGE_ONLY',\n")

          # Official smoke pure regression now supplies direct product identity and tests 5GbE.
          p=Path('.github/workflows/self-build-v22-offer-smoke.yml'); s=p.read_text(encoding='utf-8')
          old="""          specs=mb22.extract_retailer_motherboard_specs(\n              'ASRock B850M Pro RS WiFi',\n              'ASRock B850M Pro RS WiFi AMD AM5 DDR5 Micro ATX 4 x DIMM DDR5 M.2 Socket 3 Wi-Fi 6E 2.5 Gigabit Ethernet'\n          )\n"""
          new="""          identity='ASRock B850M Pro RS WiFi AMD AM5 DDR5 Micro ATX'\n          specs=mb22.extract_retailer_motherboard_specs(\n              'ASRock B850M Pro RS WiFi',\n              'ASRock B850M Pro RS WiFi AMD AM5 DDR5 Micro ATX 4 x DIMM DDR5 M.2 Socket 3 Wi-Fi 6E 2.5 Gigabit Ethernet',\n              identity\n          )\n"""
          assert old in s; s=s.replace(old,new,1)
          old="""          weak=mb22.extract_retailer_motherboard_specs(\n              'ASRock B850M Pro RS WiFi',\n              'ASRock B850M Pro RS WiFi AMD AM5 DDR5 Micro ATX 2 x DIMM DDR5 M.2 Socket 3 Wi-Fi 6E 2.5 Gigabit Ethernet'\n          )\n          assert weak['passed'] is False and '4 DIMM' in weak['missing']\n"""
          new="""          weak=mb22.extract_retailer_motherboard_specs(\n              'ASRock B850M Pro RS WiFi',\n              'ASRock B850M Pro RS WiFi AMD AM5 DDR5 Micro ATX 2 x DIMM DDR5 M.2 Socket 3 Wi-Fi 6E 2.5 Gigabit Ethernet',\n              identity\n          )\n          assert weak['passed'] is False and '4 DIMM' in weak['missing']\n          five=mb22.extract_retailer_motherboard_specs(\n              'ASRock B850M Pro RS WiFi',\n              'ASRock B850M Pro RS WiFi AMD AM5 DDR5 Micro ATX 4 x DIMM DDR5 M.2 Socket 3 Wi-Fi 6E 5 Gigabit Ethernet',\n              identity\n          )\n          assert five['passed'] is True and five['lan_gbps']==5.0\n"""
          assert old in s; p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Compile hardened V22 files
        run: python -m py_compile dba_retail_motherboard_v22.py dba_retail_prices_v22.py dba_retail_authority_v22.py dba_retail_offers_v22.py dba_self_build_v22_authoritative.py dba_retail_availability_v22.py dba_publication_gate_v22.py
      - name: Run pure regressions
        run: python -c "import dba_retail_motherboard_v22; import dba_retail_authority_v22; import dba_retail_offers_v22"
      - name: Commit Python and permanent smoke hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # Workflow file cannot be pushed by the Actions token; commit Python only.
          git restore .github/workflows/self-build-v22-offer-smoke.yml
          git add dba_retail_motherboard_v22.py dba_retail_authority_v22.py dba_retail_offers_v22.py
          git commit -m "V22: bind motherboard specs to same retailer T1 page"
          git push origin HEAD:v22/motherboard-retailer-spec-authority-2026-09-06
