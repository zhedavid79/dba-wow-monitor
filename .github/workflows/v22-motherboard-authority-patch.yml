name: V22 motherboard authority integration patch

on:
  push:
    branches: [v22/motherboard-retailer-spec-authority-2026-09-06]
    paths:
      - '.github/workflows/v22-motherboard-authority-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v22/motherboard-retailer-spec-authority-2026-09-06
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply fail-closed integration patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              assert old in s, f'patch anchor missing: {path}: {old[:100]!r}'
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Store-offer stage: verify hard specs on the same direct retailer page.
          rep('dba_retail_offers_v22.py',
              "import dba_retail_authority_v22 as authority22\nimport dba_retail_prices_v19 as retail19\n",
              "import dba_retail_authority_v22 as authority22\nimport dba_retail_motherboard_v22 as mb22\nimport dba_retail_prices_v19 as retail19\n")
          rep('dba_retail_offers_v22.py',
              "                    r.update(retailer)\n\n                strict = bool(\n",
              "                    r.update(retailer)\n                    if (\n                        out.get('kind') == 'MOTHERBOARD'\n                        and r.get('external_resolved') is True\n                        and r.get('retailer_url')\n                    ):\n                        r.update(await mb22.verify_retailer_motherboard_specs(\n                            context, str(r['retailer_url']), name\n                        ))\n\n                strict = bool(\n")
          rep('dba_retail_offers_v22.py',
              "            verified = [r for r in resolved if r.get('buy_ready_offer')]\n            delivered_values = [int(r['delivered_price_dkk']) for r in verified]\n",
              "            verified = [r for r in resolved if r.get('buy_ready_offer')]\n            if p.get('motherboard_spec_lead_v22') is True:\n                verified = [\n                    r for r in verified\n                    if r.get('retailer_component_spec_gate_passed') is True\n                    and r.get('retailer_component_spec_authority') == 'DIRECT_RETAILER_PRODUCT_PAGE_T1'\n                ]\n            delivered_values = [int(r['delivered_price_dkk']) for r in verified]\n")
          rep('dba_retail_offers_v22.py',
              "                    'same_page_price_floor_method': floor_method,\n                })\n            else:\n",
              "                    'same_page_price_floor_method': floor_method,\n                    'retailer_component_spec_gate_passed': b.get('retailer_component_spec_gate_passed'),\n                    'retailer_component_spec_authority': b.get('retailer_component_spec_authority'),\n                    'retailer_component_specs': b.get('retailer_component_specs'),\n                    'retailer_component_spec_url': b.get('retailer_component_spec_url'),\n                })\n            else:\n")
          rep('dba_retail_offers_v22.py',
              "                    'retailer_shipping_verified': False,\n                })\n",
              "                    'retailer_shipping_verified': False,\n                    'retailer_component_spec_gate_passed': False,\n                    'retailer_component_spec_authority': 'UNPROVEN',\n                    'retailer_component_specs': None,\n                    'retailer_component_spec_url': None,\n                })\n")
          rep('dba_retail_offers_v22.py',
              "            'card_price_method','retail_lead_price_dkk','same_page_lowest_price_dkk','same_page_price_floor_method'\n",
              "            'card_price_method','retail_lead_price_dkk','same_page_lowest_price_dkk','same_page_price_floor_method',\n            'retailer_component_spec_gate_passed','retailer_component_spec_authority',\n            'retailer_component_specs','retailer_component_spec_url'\n")
          rep('dba_retail_offers_v22.py',
              "        'mandatory_shipping_required_for_buy_now': True,\n",
              "        'mandatory_shipping_required_for_buy_now': True,\n        'dynamic_motherboard_promotion_requires_direct_spec_gate': True,\n")

          # Optimizer stage: SPEC_LEADs are appended only after direct retailer promotion.
          rep('dba_self_build_v22_authoritative.py',
              "import dba_component_optimizer_v19 as core\nimport dba_self_build_v20 as v20\n",
              "import dba_component_optimizer_v19 as core\nimport dba_retail_motherboard_v22 as mb22\nimport dba_self_build_v20 as v20\n")
          rep('dba_self_build_v22_authoritative.py',
              "        rows.append(c)\n    return rows\n\n\ndef validate_selected",
              "        rows.append(c)\n\n    if kind == 'MOTHERBOARD':\n        retail_doc = json.loads(RETAIL.read_text(encoding='utf-8'))\n        existing = {str(x.get('sku') or '') for x in rows}\n        for product in retail_doc.get('products') or []:\n            if product.get('motherboard_spec_lead_v22') is not True:\n                continue\n            promoted = mb22.promoted_candidate(product, product.get('retail_offer_v22') or {})\n            if not promoted or str(promoted.get('sku') or '') in existing:\n                continue\n            ok, failures = core.hard_gate('MOTHERBOARD', promoted)\n            assert ok, f'V22 retailer-promoted motherboard failed hard gate: {failures}'\n            existing.add(str(promoted.get('sku') or ''))\n            rows.append(promoted)\n    return rows\n\n\ndef validate_selected")
          rep('dba_self_build_v22_authoritative.py',
              "            assert int(c.get('delivered_price_dkk') or 0) == int(c.get('item_price_dkk') or 0) + int(c.get('shipping_dkk') or 0)\n",
              "            assert int(c.get('delivered_price_dkk') or 0) == int(c.get('item_price_dkk') or 0) + int(c.get('shipping_dkk') or 0)\n            if c.get('dynamic_retailer_promoted_v22') is True:\n                assert c.get('retailer_component_spec_gate_passed_v22') is True\n                assert c.get('retailer_component_spec_authority_v22') == 'DIRECT_RETAILER_PRODUCT_PAGE_T1'\n                assert (c.get('spec_evidence_v22') or {}).get('url')\n")

          # T1 availability: a selected dynamic board must re-prove hard specs.
          rep('dba_retail_availability_v22.py',
              "            'direct_expected': c.get('retail_offer_verified_v22') is True,\n            'comparison_url': product_url,\n",
              "            'direct_expected': c.get('retail_offer_verified_v22') is True,\n            'dynamic_spec_expected': c.get('dynamic_retailer_promoted_v22') is True,\n            'comparison_url': product_url,\n")
          rep('dba_retail_availability_v22.py',
              "        arithmetic = bool(\n            current_price\n            and item is not None\n            and shipping is not None\n            and current_price == int(item) + int(shipping)\n        )\n\n        if exp['direct_expected']:\n",
              "        arithmetic = bool(\n            current_price\n            and item is not None\n            and shipping is not None\n            and current_price == int(item) + int(shipping)\n        )\n        component_spec_ok = bool(\n            r.get('retailer_component_spec_gate_passed') is True\n            and r.get('retailer_component_spec_authority') == 'DIRECT_RETAILER_PRODUCT_PAGE_T1'\n        )\n\n        if exp['direct_expected']:\n")
          rep('dba_retail_availability_v22.py',
              "                and r.get('price_sanity_ok') is True\n            )\n",
              "                and r.get('price_sanity_ok') is True\n                and (not exp['dynamic_spec_expected'] or component_spec_ok)\n            )\n")
          rep('dba_retail_availability_v22.py',
              "            'direct_expected': exp['direct_expected'],\n            't1_verified_at': r.get('verified_at'),\n",
              "            'direct_expected': exp['direct_expected'],\n            'dynamic_spec_expected': exp['dynamic_spec_expected'],\n            'retailer_component_spec_gate_passed': r.get('retailer_component_spec_gate_passed') is True,\n            'retailer_component_spec_authority': r.get('retailer_component_spec_authority'),\n            'retailer_component_specs': r.get('retailer_component_specs'),\n            'retailer_component_spec_url': r.get('retailer_component_spec_url'),\n            't1_verified_at': r.get('verified_at'),\n")
          rep('dba_retail_availability_v22.py',
              "            'Prisjagt-only candidates remain RETAIL_LEAD and can only revalidate the current live offer-list reference.'\n",
              "            'Prisjagt-only candidates remain RETAIL_LEAD and can only revalidate the current live offer-list reference. '\n            'A dynamically promoted motherboard must also re-prove every hard motherboard specification on the direct retailer page.'\n")

          # Publication gate: selected dynamic motherboards retain spec authority through T1.
          rep('dba_publication_gate_v22.py',
              "            assert int(x.get('delivered_price_dkk') or 0)==int(x.get('item_price_dkk') or 0)+int(x.get('shipping_dkk') or 0)\n\n            assert act.get('procurement_action')=='BUY_NOW'",
              "            assert int(x.get('delivered_price_dkk') or 0)==int(x.get('item_price_dkk') or 0)+int(x.get('shipping_dkk') or 0)\n            if x.get('dynamic_retailer_promoted_v22') is True:\n                assert x.get('retailer_component_spec_gate_passed_v22') is True\n                assert x.get('retailer_component_spec_authority_v22')=='DIRECT_RETAILER_PRODUCT_PAGE_T1'\n                assert orow.get('retailer_component_spec_gate_passed') is True\n                assert orow.get('retailer_component_spec_authority')=='DIRECT_RETAILER_PRODUCT_PAGE_T1'\n                assert ar.get('retailer_component_spec_gate_passed') is True\n                assert ar.get('retailer_component_spec_authority')=='DIRECT_RETAILER_PRODUCT_PAGE_T1'\n\n            assert act.get('procurement_action')=='BUY_NOW'")
          PY
      - name: Compile patched V22 files
        run: python -m py_compile dba_retail_motherboard_v22.py dba_retail_prices_v22.py dba_retail_offers_v22.py dba_self_build_v22_authoritative.py dba_retail_availability_v22.py dba_publication_gate_v22.py
      - name: Commit Python integration patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dba_retail_offers_v22.py dba_self_build_v22_authoritative.py dba_retail_availability_v22.py dba_publication_gate_v22.py
          git commit -m "V22: integrate retailer-backed motherboard spec promotion"
          git push origin HEAD:v22/motherboard-retailer-spec-authority-2026-09-06
