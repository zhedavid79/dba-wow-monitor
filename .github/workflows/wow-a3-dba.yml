name: WoW DBA Price-First Complete-PC Report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 10 * * *'
    - cron: '0 17 * * *'
  push:
    branches: [main]
    paths:
      - 'dba_browser_v2.py'
      - 'dba_browser_v3.py'
      - 'dba_browser_v4.py'
      - 'dba_browser_v5.py'
      - 'dba_browser_v6.py'
      - 'dba_browser_v6_recovery.py'
      - 'dba_browser_v7_intelligence.py'
      - 'dba_listing_intelligence.py'
      - 'dba_decision_report.py'
      - 'dba_complete_price_first_active.py'
      - 'dba_t1_preflight.py'
      - 'dba_t1_schema_probe.py'
      - 'dba_t1_hydration_ancestor.py'
      - '.github/workflows/wow-a3-dba.yml'

permissions:
  contents: write

concurrency:
  group: wow-dba-authoritative-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser dependencies
        timeout-minutes: 6
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Compile price-first complete-PC model
        run: python -m py_compile dba_browser_v2.py dba_browser_v3.py dba_browser_v4.py dba_browser_v5.py dba_browser_v6.py dba_browser_v6_recovery.py dba_browser_v7_intelligence.py dba_listing_intelligence.py dba_decision_report.py dba_complete_price_first_active.py dba_t1_preflight.py dba_t1_schema_probe.py dba_t1_hydration_ancestor.py
      - name: Diagnose DBA source/schema gate
        timeout-minutes: 3
        run: python dba_t1_preflight.py
      - name: Scan complete used PCs with T0/T1 listing intelligence
        timeout-minutes: 22
        run: python dba_browser_v7_intelligence.py
      - name: Generate active price-first complete-PC report
        timeout-minutes: 2
        run: python dba_complete_price_first_active.py
      - name: Validate complete-PC publication gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          c=json.loads(Path('results/wow_a3_latest.json').read_text(encoding='utf-8'))
          assert c.get('gate_passed') is True
          assert c.get('model_version')=='DBA-WOW-PRICE-FIRST-COMPLETE-PC-V14'
          assert c.get('active_model')=='PRICE_FIRST_COMPLETE_PC_ONLY'
          assert c.get('price_binding_regression',{}).get('ok') is True
          assert (c.get('coverage',{}).get('discovery') or {}).get('complete') is True
          assert (c.get('coverage',{}).get('t1') or {}).get('complete') is True
          assert (c.get('source_gate') or {}).get('ok') is True
          scope=str(c.get('scope') or '')
          assert 'No self-build, donor-build or component procurement' in scope
          ranked=c.get('ranked') or []
          assert '7969913' not in {str(r.get('listing_id')) for r in ranked}
          seen=set()
          for r in ranked:
              lid=str(r.get('listing_id') or '')
              assert lid and lid not in seen; seen.add(lid)
              assert r.get('url')==f'https://www.dba.dk/recommerce/forsale/item/{lid}'
              assert isinstance(r.get('ask_t0'),int) and isinstance(r.get('ask_t1'),int)
              assert r.get('currency')=='DKK'
              assert r.get('status')
              assert r.get('t0_source') and r.get('t1_source')
              assert r.get('performance_class') in {'ACCEPTABLE','SWEET SPOT','OVERKILL'}
              assert r.get('listing_intelligence')
          report=Path('results/wow_a3_report.md').read_text(encoding='utf-8')
          assert 'FULDT PÅLIDELIG DBA-PRISRAPPORT' in report
          assert 'Ingen byg-selv, donor-builds eller komponentjagt' in report
          assert '7969913' not in '\n'.join(line for line in report.splitlines() if line.startswith('|') or line.startswith('['))
          for marker in ('Buy now','Billigste tilstrækkelige','Bedste budcase','Ranked shortlist','Evidensmatrix','WoW-scenarier','Budmodel','Leads','Objektive diskvalifikationer','Konklusion'):
              assert marker in report,marker
          print(f"PASS PRICE-FIRST COMPLETE-PC: {len(ranked)} ranked verified PCs")
          PY
      - name: Publish authoritative complete-PC results
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/wow-results
          cp results/wow_a3_latest.json results/wow_a3_report.md /tmp/wow-results/
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/wow-results/* results/
            git add results/wow_a3_latest.json results/wow_a3_report.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update verified WoW complete-PC price report [skip ci]"
            if git push origin main; then exit 0; fi
          done
          exit 1
