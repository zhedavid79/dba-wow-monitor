name: WoW DBA Price-First Complete-PC Report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 10 * * *'
    - cron: '0 17 * * *'
  push:
    branches: [main]
    paths:
      - 'dba_browser_v2.py'
      - 'dba_browser_v3.py'
      - 'dba_browser_v4.py'
      - 'dba_browser_v5.py'
      - 'dba_browser_v6.py'
      - 'dba_browser_v6_recovery.py'
      - 'dba_browser_v7_intelligence.py'
      - 'dba_listing_intelligence.py'
      - 'dba_decision_report.py'
      - 'dba_t1_preflight.py'
      - '.github/workflows/wow-a3-dba.yml'

permissions:
  contents: write

concurrency:
  group: wow-dba-authoritative-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser dependencies
        timeout-minutes: 6
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Compile complete-PC model
        run: python -m py_compile dba_browser_v2.py dba_browser_v3.py dba_browser_v4.py dba_browser_v5.py dba_browser_v6.py dba_browser_v6_recovery.py dba_browser_v7_intelligence.py dba_listing_intelligence.py dba_decision_report.py dba_t1_preflight.py
      - name: Diagnose DBA T1 preflight
        timeout-minutes: 3
        run: python dba_t1_preflight.py
      - name: Run complete-PC high-recall scanner with listing intelligence
        timeout-minutes: 18
        run: python dba_browser_v7_intelligence.py
      - name: Generate price-first complete-PC decision report
        timeout-minutes: 2
        run: python dba_decision_report.py
      - name: Validate complete-PC publication gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          d=json.loads(Path('results/wow_a3_latest.json').read_text(encoding='utf-8'))
          assert d.get('gate_passed') is True, 'PRICE DATA GATE FAILED'
          assert d.get('model_version') == 'DBA-WOW-PRICE-FIRST-COMPLETE-PC-V14'
          assert d.get('price_binding_regression',{}).get('ok') is True, 'PRICE BINDING FIXTURE FAILED'

          cov=d.get('coverage') or {}
          assert (cov.get('discovery') or {}).get('complete') is True, 'COMPLETE-PC DISCOVERY COVERAGE INCOMPLETE'
          assert (cov.get('t1') or {}).get('complete') is True, 'COMPLETE-PC T1 COVERAGE INCOMPLETE'

          sg=d.get('source_gate') or {}
          assert sg.get('ok') is True and sg.get('listing_id'), 'SOURCE GATE MISSING'
          assert isinstance(sg.get('t1_price'), int) and sg.get('currency') == 'DKK', 'SOURCE GATE PRICE INVALID'
          assert str(sg.get('status','')).rstrip('/').lower().endswith('instock'), 'SOURCE GATE STATUS INVALID'
          assert sg.get('t0_source') == 'rendered_dba_card', 'T0 SOURCE INVALID'
          assert sg.get('t1_source') == 'dba_jsonld_product_all_scripts', 'T1 SOURCE INVALID'

          li=d.get('listing_intelligence') or {}
          assert li.get('ranking_reconciled') is True, 'LISTING INTELLIGENCE RANKING NOT RECONCILED'
          # T1 coverage measures attempted candidate IDs. The payload cache intentionally
          # contains only IDs that returned an actual structured T1 object, so it must not
          # be compared with candidate_total. Ranked rows are validated individually below
          # for live T1 source, price/status and VERIFIED CPU/GPU listing intelligence.
          assert li.get('cached_t1_records',0) >= len(d.get('ranked') or []), 'RANKED T1 PAYLOAD CACHE INCOMPLETE'

          ranked=d.get('ranked') or []
          assert d.get('decision_summary'), 'DECISION SUMMARY MISSING'
          assert d['decision_summary'].get('self_build') is False
          assert d['decision_summary'].get('donor_builds') is False
          assert d['decision_summary'].get('component_procurement') is False

          for r in ranked:
              assert r.get('listing_id') and r.get('url') and isinstance(r.get('ask_t1'),int)
              assert r.get('currency') == 'DKK'
              assert str(r.get('status','')).rstrip('/').lower().endswith('instock')
              assert r.get('t0_source') == 'rendered_dba_card'
              assert r.get('t1_source') == 'dba_jsonld_product_all_scripts'
              assert (r.get('listing_intelligence') or {}).get('cpu',{}).get('confidence') == 'VERIFIED'
              assert (r.get('listing_intelligence') or {}).get('gpu',{}).get('confidence') == 'VERIFIED'
              assert r.get('performance_class') in {'ACCEPTABLE','SWEET SPOT','OVERKILL'}
              assert isinstance((r.get('bid_model') or {}).get('start_bid'), int)

          report=Path('results/wow_a3_report.md').read_text(encoding='utf-8')
          assert 'FULDT PÅLIDELIG DBA-PRISRAPPORT' in report
          assert 'Ranked shortlist' in report
          assert 'Budmodel' in report
          assert 'Objektive diskvalifikationer' in report
          print(f"PASS COMPLETE-PC V14: {len(ranked)} ranked complete PCs; T1 {cov['t1'].get('candidate_completed')}/{cov['t1'].get('candidate_total')}")
          PY
      - name: Publish authoritative complete-PC results
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/wow-results
          cp results/wow_a3_latest.json results/wow_a3_report.md /tmp/wow-results/
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/wow-results/* results/
            git add results/wow_a3_latest.json results/wow_a3_report.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update verified WoW complete-PC price-first report [skip ci]"
            if git push origin main; then exit 0; fi
          done
          exit 1
