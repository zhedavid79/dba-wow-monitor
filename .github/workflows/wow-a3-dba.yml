name: WoW DBA Z20 Upgradeable Report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 10 * * *'
    - cron: '0 17 * * *'
  push:
    branches: [main]
    paths: ['dba_browser_v2.py','dba_browser_v3.py','dba_browser_v4.py','dba_browser_v5.py','dba_browser_v6.py','dba_z20_parts.py','wow_value_model.py','.github/workflows/wow-a3-dba.yml']

permissions:
  contents: write
concurrency:
  group: wow-dba-authoritative-report
  cancel-in-progress: true
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install browser dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Run complete-PC high-recall scanner
        run: python dba_browser_v6.py
      - name: Run Z20 component and bundle scanner
        run: python dba_z20_parts.py
      - name: Apply Z20 upgradeable procurement model
        run: python wow_value_model.py
      - name: Validate V11 Z20 fit publication gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/wow_a3_latest.json').read_text(encoding='utf-8')); p=json.loads(Path('results/z20_parts_latest.json').read_text(encoding='utf-8'))
          assert d.get('gate_passed') is True, 'PRICE DATA GATE FAILED'
          assert d.get('model_version') == 'DBA-WOW-Z20-UPGRADEABLE-V11'
          assert p.get('gate_passed') is True and p.get('model_version') == 'DBA-Z20-PARTS-V3'
          assert p.get('classifier_regression',{}).get('ok') is True
          parts=p.get('opportunities') or []; ranked=d.get('ranked') or []
          assert all(r.get('listing_id') and r.get('url') and isinstance(r.get('ask_t1'),int) for r in ranked+parts)
          assert all(r.get('currency')=='DKK' and str(r.get('status','')).rstrip('/').lower().endswith('instock') for r in ranked+parts)
          assert all(r.get('t0_source')=='rendered_dba_card' and r.get('t1_source')=='dba_jsonld_product_all_scripts' for r in ranked+parts)
          assert all(r.get('z20_fit') in {'COMPATIBLE','INCOMPATIBLE','UNVERIFIED','NOT_APPLICABLE'} for r in parts)
          assert all(r.get('upgradeability') in {'EXCELLENT','GOOD','LIMITED','POOR','UNVERIFIED','NOT_APPLICABLE'} for r in parts)
          # Absolute rule: no ATX/unknown platform bundle may be build-eligible.
          for r in d.get('parts_scan',{}).get('opportunities',[]):
              if r.get('kind')=='PLATFORM_BUNDLE' and r.get('build_eligible'):
                  assert r.get('z20_fit')=='COMPATIBLE', f"unsafe bundle admitted: {r.get('listing_id')}"
                  assert r.get('condition')!='DEFECT_DISCLOSED'
          print(f"PASS V11: {len(ranked)} complete-PC safety-net rows; {len(parts)} component rows; Z20 fit gate enforced")
          PY
      - name: Publish authoritative V11 results
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/wow-results
          cp results/wow_a3_latest.json results/wow_a3_report.md results/z20_parts_latest.json /tmp/wow-results/
          for attempt in 1 2 3; do
            git fetch origin main; git reset --hard origin/main; cp /tmp/wow-results/* results/
            git add results/wow_a3_latest.json results/wow_a3_report.md results/z20_parts_latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update verified WoW Z20 V11 DBA report [skip ci]"
            if git push origin main; then exit 0; fi
          done
          exit 1
