name: WoW DBA Price-First Report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 10 * * *'
    - cron: '0 17 * * *'
  push:
    branches: [main]
    paths:
      - 'dba_browser_v2.py'
      - 'dba_browser_v3.py'
      - 'dba_browser_v4.py'
      - 'dba_browser_v5.py'
      - 'dba_browser_v6.py'
      - 'wow_value_model.py'
      - '.github/workflows/probe.yml'
      - '.github/workflows/wow-a3-dba.yml'

permissions:
  contents: write

concurrency:
  group: wow-dba-authoritative-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Run browser-native high-recall WoW scanner
        run: python dba_browser_v6.py
      - name: Apply value-aware procurement model
        run: python wow_value_model.py
      - name: Validate publication gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('results/wow_a3_latest.json').read_text(encoding='utf-8'))
          assert d.get('gate_passed') is True, 'PRICE DATA GATE FAILED'
          ranked = d.get('ranked') or []
          unresolved = d.get('potential_sweet_spots_unresolved') or []
          assert d.get('model_version') == 'DBA-WOW-VALUE-AWARE-V8'
          assert all(r.get('listing_id') and r.get('url') and isinstance(r.get('ask_t1'), int) for r in ranked)
          assert all(r.get('t0_source') == 'rendered_dba_card' for r in ranked)
          assert all(r.get('t1_source') == 'dba_jsonld_product_all_scripts' for r in ranked)
          assert all(r.get('currency') == 'DKK' for r in ranked)
          assert all(str(r.get('status','')).rstrip('/').lower().endswith('instock') for r in ranked)
          assert all(r.get('performance_status') == 'SUFFICIENT' for r in ranked)
          assert all(r.get('value_class') in {'SWEET SPOT','GOOD VALUE','EXCESS SPEND FOR THIS USE CASE'} for r in ranked)
          assert len({str(r['listing_id']) for r in ranked}) == len(ranked)
          assert all(ranked[i]['ask_t1'] <= ranked[i+1]['ask_t1'] for i in range(len(ranked)-1))
          ceiling = d['value_model']['sweet_spot_price_ceiling']
          assert all(r['ask_t1'] <= ceiling for r in ranked if r['value_class'] == 'SWEET SPOT')
          assert all(r['ask_t1'] > ceiling for r in ranked if r['value_class'] == 'EXCESS SPEND FOR THIS USE CASE')
          ranked_ids = {str(r['listing_id']) for r in ranked}
          assert not ranked_ids.intersection(str(r['listing_id']) for r in unresolved)
          print(f"PASS V8: {len(ranked)} ranked; sweet-spot ceiling {ceiling} DKK; {len(unresolved)} unresolved")
          PY
      - name: Publish authoritative WoW results
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/wow-results
          cp results/wow_a3_latest.json /tmp/wow-results/
          cp results/wow_a3_report.md /tmp/wow-results/
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/wow-results/* results/
            git add results/wow_a3_latest.json results/wow_a3_report.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update verified WoW value-aware DBA report [skip ci]"
            if git push origin main; then exit 0; fi
          done
          exit 1
