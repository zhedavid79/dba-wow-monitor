name: WoW DBA Cross-Route Value & Upgrade Report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 10 * * *'
    - cron: '0 17 * * *'
  push:
    branches: [main]
    paths:
      - 'dba_browser_v2.py'
      - 'dba_browser_v3.py'
      - 'dba_browser_v4.py'
      - 'dba_browser_v5.py'
      - 'dba_browser_v6.py'
      - 'dba_browser_v6_recovery.py'
      - 'dba_browser_v7_intelligence.py'
      - 'dba_listing_intelligence.py'
      - 'dba_decision_report.py'
      - 'dba_t1_preflight.py'
      - 'dba_z20_parts.py'
      - 'dba_z20_parts_recovery.py'
      - 'dba_strategy_parts.py'
      - 'dba_z20_donors.py'
      - 'dba_z20_donors_recovery.py'
      - 'z20_complete_optimizer.py'
      - 'dba_strategy_optimizer.py'
      - 'dba_strategy_report.py'
      - '.github/workflows/wow-a3-dba.yml'

permissions:
  contents: write

concurrency:
  group: wow-dba-authoritative-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser dependencies
        timeout-minutes: 6
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Compile cross-route model
        run: python -m py_compile dba_browser_v2.py dba_browser_v3.py dba_browser_v4.py dba_browser_v5.py dba_browser_v6.py dba_browser_v6_recovery.py dba_browser_v7_intelligence.py dba_listing_intelligence.py dba_decision_report.py dba_t1_preflight.py dba_z20_parts.py dba_z20_parts_recovery.py dba_strategy_parts.py dba_z20_donors.py dba_z20_donors_recovery.py z20_complete_optimizer.py dba_strategy_optimizer.py dba_strategy_report.py
      - name: Diagnose DBA source/schema gate
        timeout-minutes: 3
        run: python dba_t1_preflight.py
      - name: Scan complete used PCs with T0/T1 listing intelligence
        timeout-minutes: 18
        run: python dba_browser_v7_intelligence.py
      - name: Prepare complete-PC baseline and bid data
        timeout-minutes: 2
        run: python dba_decision_report.py
      - name: Scan used components and bundles with same live price gate
        timeout-minutes: 15
        run: python dba_strategy_parts.py
      - name: Resolve complete-PC upgrade and donor routes
        timeout-minutes: 7
        run: python dba_z20_donors_recovery.py
      - name: Optimize TCWP across complete, upgrade, used-build and hybrid routes
        timeout-minutes: 2
        run: python dba_strategy_optimizer.py
      - name: Generate unified cross-route report
        timeout-minutes: 2
        run: python dba_strategy_report.py
      - name: Validate V15 cross-route publication gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          s=json.loads(Path('results/wow_strategy_latest.json').read_text(encoding='utf-8'))
          c=json.loads(Path('results/wow_a3_latest.json').read_text(encoding='utf-8'))
          p=json.loads(Path('results/z20_parts_latest.json').read_text(encoding='utf-8'))
          q=json.loads(Path('results/z20_donors_latest.json').read_text(encoding='utf-8'))

          assert s.get('gate_passed') is True
          assert s.get('model_version') == 'DBA-WOW-CROSS-ROUTE-V15'
          assert c.get('gate_passed') is True and c.get('price_binding_regression',{}).get('ok') is True
          assert (c.get('coverage',{}).get('discovery') or {}).get('complete') is True
          assert (c.get('coverage',{}).get('t1') or {}).get('complete') is True
          assert p.get('gate_passed') is True
          assert (p.get('coverage',{}).get('discovery') or {}).get('complete') is True
          assert (p.get('coverage',{}).get('t1') or {}).get('complete') is True
          assert q.get('gate_passed') is True

          ranked=s.get('ranked') or []
          assert ranked, 'NO CROSS-ROUTE SOLUTIONS'
          assert s.get('buy_now') and isinstance(s['buy_now'].get('tcwp'),int)
          assert s.get('best_complete_pc'), 'COMPLETE-PC ROUTE MISSING'

          used_count=0
          for r in ranked:
              assert r.get('route') in {'COMPLETE_USED_PC','USED_PC_PLUS_FUTURE_UPGRADE','USED_BUILD','HYBRID_USED_NEW'}
              assert isinstance(r.get('tcwp'),int) and r['tcwp']>0
              assert r.get('performance_class') in {'ACCEPTABLE','SWEET SPOT','OVERKILL'}
              assert r.get('upgradeability') in {'A','B','C','D'}
              assert r.get('z20_fit') in {'VERIFIED','LIKELY','UNKNOWN','NO'}
              comps=r.get('components') or []
              assert comps
              assert sum(int(x['price']) for x in comps)==r['tcwp']
              for x in comps:
                  assert x.get('source') in {'USED ASK','NEW RETAIL'}
                  assert isinstance(x.get('price'),int) and x['price']>0
                  assert x.get('url')
                  if x['source']=='USED ASK':
                      used_count += 1
                      assert x.get('listing_id'), 'USED COMPONENT MISSING LISTING ID'
          assert used_count>0

          report=Path('results/wow_a3_report.md').read_text(encoding='utf-8')
          for marker in ('BUY NOW','CHEAPEST SWEET SPOT','BEST UPGRADE PLATFORM','BEST COMPLETE PC','BEST USED BUILD','BEST HYBRID BUILD','Samlet ranking'):
              assert marker in report, marker
          print(f"PASS CROSS-ROUTE V15: {len(ranked)} finished solutions; used refs={used_count}; routes={s.get('counts')}")
          PY
      - name: Publish authoritative cross-route results
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/wow-results
          cp results/wow_a3_latest.json results/wow_a3_report.md results/wow_strategy_latest.json results/z20_parts_latest.json results/z20_donors_latest.json /tmp/wow-results/
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/wow-results/* results/
            git add results/wow_a3_latest.json results/wow_a3_report.md results/wow_strategy_latest.json results/z20_parts_latest.json results/z20_donors_latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update verified WoW cross-route value report [skip ci]"
            if git push origin main; then exit 0; fi
          done
          exit 1
