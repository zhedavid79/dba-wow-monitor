name: WoW DBA Legacy Golden Manual Regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: baseline/v19-green-2026-09-05
      - name: Validate frozen V19 golden baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('results/wow_self_build_report.md')
          assert p.exists()
          text=p.read_text(encoding='utf-8')
          assert text.startswith('# FULDT PÅLIDELIG DBA-PRISRAPPORT — WoW SELF-BUILD FIRST V19')
          assert 'ANBEFALET SELVBYG' in text
          print('PASS V19 GOLDEN BASELINE')
          PY
      - name: No publication
        run: echo 'Legacy workflow is manual/read-only. V22 owns scheduled publication.'
