name: V22 motherboard route authority probe

on:
  push:
    branches: [v22/motherboard-retailer-spec-authority-2026-09-06]
    paths: ['.github/workflows/v22-motherboard-route-authority-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Probe the seven current spec leads
        run: |
          python - <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright
          import dba_retail_offers_v22 as offers

          PRODUCTS=[
            {'sku':'P1','kind':'MOTHERBOARD','name':'Gigabyte B850M Gaming X WIFI6E','url':'https://prisjagt.dk/product.php?p=14363537','price':1397},
            {'sku':'P2','kind':'MOTHERBOARD','name':'MSI MAG B850M Mortar WIFI','url':'https://prisjagt.dk/product.php?p=14661306','price':1519},
            {'sku':'P3','kind':'MOTHERBOARD','name':'ASRock B850M-X WiFi R2.0','url':'https://prisjagt.dk/product.php?p=14636102','price':957},
            {'sku':'P4','kind':'MOTHERBOARD','name':'ASRock B650M-HDV/M.2','url':'https://prisjagt.dk/product.php?p=8517097','price':813},
            {'sku':'P5','kind':'MOTHERBOARD','name':'ASRock B650M Pro RS','url':'https://prisjagt.dk/product.php?p=11613276','price':984},
            {'sku':'P6','kind':'MOTHERBOARD','name':'MSI B650M Gaming Plus WIFI','url':'https://prisjagt.dk/product.php?p=13343717','price':1304},
            {'sku':'P7','kind':'MOTHERBOARD','name':'Gigabyte B650M Aorus Elite AX','url':'https://prisjagt.dk/product.php?p=7161986','price':1348},
          ]
          async def main():
            async with async_playwright() as pw:
              browser=await pw.chromium.launch(headless=True)
              context=await browser.new_context(
                locale='da-DK',
                user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
                extra_http_headers={'Accept-Language':'da-DK,da;q=0.9,en;q=0.8'},
              )
              sem=asyncio.Semaphore(4)
              rows=await asyncio.gather(*(offers.inspect(context,p,sem,offers.kinds()) for p in PRODUCTS))
              for row in rows:
                print('PRODUCT',json.dumps({
                  'name':row.get('name'),'identity':row.get('identity_verified'),
                  'floor':row.get('same_page_lowest_price_dkk'),
                  'delivered':row.get('delivered_price_verified'),
                  'error':row.get('error'),
                  'offer_count':len(row.get('offers') or []),
                },ensure_ascii=False))
                for r in (row.get('offers') or [])[:12]:
                  print('OFFER',json.dumps({
                    'seller_hint':r.get('seller_hint'),'price':r.get('displayed_price_dkk'),
                    'card_current':r.get('card_current'),'redirect':r.get('redirect_url'),
                    'store_id':r.get('store_id'),'offer_id':r.get('offer_id'),
                    'route':r.get('external_route_resolved'),'route_method':r.get('route_resolution_method'),
                    'route_candidates':r.get('route_candidates'),'direct_url':r.get('direct_url'),
                    'redirect_status':r.get('redirect_http_status'),'adapter_status':r.get('adapter_http_status'),
                    'adapter_error':r.get('adapter_error'),'resolve_error':r.get('resolve_error'),
                    'retailer_host':r.get('retailer_host'),'retailer_error':r.get('retailer_error'),
                    'retailer_identity':r.get('retailer_identity_verified'),
                    'retailer_price':r.get('retailer_price_verified'),
                    'retailer_stock':r.get('retailer_stock_verified'),
                    'retailer_shipping':r.get('retailer_shipping_verified'),
                    'retailer_item':r.get('retailer_item_price_dkk'),
                    'retailer_delivery':r.get('retailer_delivered_price_dkk'),
                    'buy_ready':r.get('buy_ready_offer'),
                    'spec_pass':r.get('retailer_component_spec_gate_passed'),
                    'spec_error':r.get('retailer_component_spec_error'),
                    'specs':r.get('retailer_component_specs'),
                  },ensure_ascii=False))
              await context.close(); await browser.close()
          asyncio.run(main())
          PY
