name: WoW DBA V20 Manual Regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wow-dba-v20-manual-regression
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Run V20 live regression without publishing
        run: |
          python dba_t1_preflight.py
          python dba_browser_v20.py
          python dba_decision_report.py
          python dba_strategy_parts_v20.py
          python dba_z20_donors_recovery.py
          python dba_route_pipeline_v20.py
          python dba_retail_prices_v20.py
          python dba_self_build_v20_authoritative.py
          python dba_strategy_report_v20.py
          python dba_publication_gate_v20_authoritative.py
      - name: Confirm no legacy publication step exists
        run: echo 'V20 regression passed; V22 is the only scheduled WoW publisher.'
