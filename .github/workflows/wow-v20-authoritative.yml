name: WoW DBA Authoritative V20

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 10 * * *'
    - cron: '0 17 * * *'
  push:
    branches: [main]
    paths:
      - 'dba_browser_v2.py'
      - 'dba_browser_v3.py'
      - 'dba_browser_v4.py'
      - 'dba_browser_v5.py'
      - 'dba_browser_v6.py'
      - 'dba_browser_v6_recovery.py'
      - 'dba_browser_v7_intelligence.py'
      - 'dba_browser_v20.py'
      - 'dba_listing_intelligence.py'
      - 'dba_decision_report.py'
      - 'dba_t1_preflight.py'
      - 'dba_t1_schema_probe.py'
      - 'dba_t1_hydration_ancestor.py'
      - 'dba_z20_parts.py'
      - 'dba_z20_parts_recovery.py'
      - 'dba_strategy_parts.py'
      - 'dba_strategy_parts_v20.py'
      - 'dba_z20_donors.py'
      - 'dba_z20_donors_recovery.py'
      - 'z20_complete_optimizer.py'
      - 'dba_strategy_optimizer.py'
      - 'dba_platform_first_v16.py'
      - 'dba_platform_first_v20.py'
      - 'dba_self_build_v17.py'
      - 'dba_build_alternatives.py'
      - 'dba_self_build_v18.py'
      - 'dba_component_optimizer_v19.py'
      - 'dba_component_market_v19.py'
      - 'dba_gpu_model_v20.py'
      - 'dba_route_pipeline_v20.py'
      - 'dba_retail_prices_v20.py'
      - 'dba_self_build_v20.py'
      - 'dba_self_build_v20_authoritative.py'
      - 'dba_strategy_report_v19.py'
      - 'dba_strategy_report_v20.py'
      - 'dba_publication_gate_v20.py'
      - 'dba_publication_gate_v20_authoritative.py'
      - 'dba_compact_publish_v20.py'
      - '.github/workflows/wow-v20-authoritative.yml'

permissions:
  contents: write

concurrency:
  group: wow-dba-authoritative-v20
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Compile V20 procurement model
        run: |
          python -m py_compile \
            dba_browser_v2.py dba_browser_v3.py dba_browser_v4.py dba_browser_v5.py \
            dba_browser_v6.py dba_browser_v6_recovery.py dba_browser_v7_intelligence.py dba_browser_v20.py \
            dba_listing_intelligence.py dba_decision_report.py dba_t1_preflight.py dba_t1_schema_probe.py dba_t1_hydration_ancestor.py \
            dba_z20_parts.py dba_z20_parts_recovery.py dba_strategy_parts.py dba_strategy_parts_v20.py \
            dba_z20_donors.py dba_z20_donors_recovery.py z20_complete_optimizer.py dba_strategy_optimizer.py \
            dba_platform_first_v16.py dba_platform_first_v20.py dba_self_build_v17.py dba_build_alternatives.py dba_self_build_v18.py \
            dba_component_optimizer_v19.py dba_component_market_v19.py dba_gpu_model_v20.py dba_route_pipeline_v20.py \
            dba_retail_prices_v20.py dba_self_build_v20.py dba_self_build_v20_authoritative.py \
            dba_strategy_report_v19.py dba_strategy_report_v20.py dba_publication_gate_v20.py \
            dba_publication_gate_v20_authoritative.py dba_compact_publish_v20.py

      - name: Diagnose DBA source/schema gate
        timeout-minutes: 3
        run: python dba_t1_preflight.py

      - name: Scan complete used PCs and build same-run T1 cache
        timeout-minutes: 18
        run: python dba_browser_v20.py

      - name: Prepare complete-PC market reference and bid data
        run: python dba_decision_report.py

      - name: Scan used components with V20 RAM/GPU coverage and cache reuse
        timeout-minutes: 18
        run: python dba_strategy_parts_v20.py

      - name: Resolve complete-PC donor routes
        timeout-minutes: 4
        run: python dba_z20_donors_recovery.py

      - name: Build V18 route baseline through reserved-family V20 GPU universe
        timeout-minutes: 4
        run: python dba_route_pipeline_v20.py

      - name: Verify and dynamically discover V20 retail market
        timeout-minutes: 7
        run: python dba_retail_prices_v20.py

      - name: Apply authoritative V20 GPU fit RAM retail and bid model
        run: python dba_self_build_v20_authoritative.py

      - name: Generate authoritative V20 report
        run: python dba_strategy_report_v20.py

      - name: Validate authoritative V20 publication gate
        run: python dba_publication_gate_v20_authoritative.py

      - name: Preserve gated V20 snapshot
        uses: actions/upload-artifact@v4
        with:
          name: wow-v20-gated-${{ github.run_id }}
          retention-days: 3
          compression-level: 6
          path: |
            results/wow_a3_latest.json
            results/wow_a3_report.md
            results/wow_platform_first_report.md
            results/wow_self_build_report.md
            results/wow_self_build_report_v20.md
            results/wow_strategy_latest.json
            results/retail_prices_latest.json
            results/retail_discovery_v20.json
            results/z20_parts_latest.json
            results/z20_donors_latest.json
            results/t1_cache_v20.json

      - name: Compact verified V20 publication snapshot
        run: python dba_compact_publish_v20.py

      - name: Validate publish payload size
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('results/wow_strategy_latest.json')
          size=p.stat().st_size
          limit=90*1024*1024
          assert size < limit, f'Compact V20 strategy snapshot still too large: {size/1024/1024:.2f} MiB'
          print(f'PASS PUBLISH SIZE: {size/1024/1024:.2f} MiB < 90 MiB')
          PY

      - name: Publish authoritative V20 self-build-first results
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/wow-v20-results
          cp \
            results/wow_a3_latest.json \
            results/wow_a3_report.md \
            results/wow_platform_first_report.md \
            results/wow_self_build_report.md \
            results/wow_self_build_report_v20.md \
            results/wow_strategy_latest.json \
            results/retail_prices_latest.json \
            results/retail_discovery_v20.json \
            results/z20_parts_latest.json \
            results/z20_donors_latest.json \
            /tmp/wow-v20-results/
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/wow-v20-results/* results/
            git add \
              results/wow_a3_latest.json \
              results/wow_a3_report.md \
              results/wow_platform_first_report.md \
              results/wow_self_build_report.md \
              results/wow_self_build_report_v20.md \
              results/wow_strategy_latest.json \
              results/retail_prices_latest.json \
              results/retail_discovery_v20.json \
              results/z20_parts_latest.json \
              results/z20_donors_latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update verified WoW V20 self-build-first report [skip ci]"
            if git push origin main; then exit 0; fi
          done
          exit 1
