name: WoW Self-Build V20 GPU Fit Retail Cache Bid Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dba_gpu_model_v20.py'
      - 'dba_browser_v20.py'
      - 'dba_strategy_parts_v20.py'
      - 'dba_platform_first_v20.py'
      - 'dba_retail_prices_v20.py'
      - 'dba_self_build_v20.py'
      - 'dba_strategy_report_v20.py'
      - '.github/workflows/self-build-v20-smoke.yml'

permissions:
  contents: read

concurrency:
  group: wow-v20-procurement-smoke
  cancel-in-progress: true

jobs:
  decision:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Compile V20
        run: python -m py_compile dba_gpu_model_v20.py dba_browser_v20.py dba_strategy_parts_v20.py dba_platform_first_v20.py dba_retail_prices_v20.py dba_self_build_v20.py dba_strategy_report_v20.py
      - name: GPU value fit and bid regression
        run: python dba_gpu_model_v20.py
      - name: GPU pool stratification regression
        run: |
          python - <<'PY'
          import dba_platform_first_v20 as p
          rows=[]
          for i in range(30):
              rows.append({'kind':'GPU','listing_id':f'cheap{i}','title':f'RTX 2070 gpu {i}','gpu':'RTX 2070','gpu_score':58,'ask_t1':700+i,'condition':'NO_DEFECT_SIGNAL'})
          rows += [
              {'kind':'GPU','listing_id':'6800xt','title':'RX 6800 XT gpu','gpu':'RX 6800 XT','gpu_score':90,'ask_t1':2500,'condition':'NO_DEFECT_SIGNAL'},
              {'kind':'GPU','listing_id':'6700xt','title':'RX 6700 XT gpu','gpu':'RX 6700 XT','gpu_score':68,'ask_t1':1900,'condition':'NO_DEFECT_SIGNAL'},
              {'kind':'GPU','listing_id':'3060ti','title':'RTX 3060 Ti gpu','gpu':'RTX 3060 Ti','gpu_score':70,'ask_t1':1700,'condition':'NO_DEFECT_SIGNAL'},
          ]
          pool=p.stratified_gpu_pool(rows)
          ids={x['listing_id'] for x in pool}
          assert {'6800xt','6700xt','3060ti'} <= ids, ids
          assert len(pool) <= 40
          print({'PASS':True,'pool':len(pool),'target_ids':sorted({'6800xt','6700xt','3060ti'} & ids)})
          PY
      - name: Same-run cache loader regression
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import dba_strategy_parts_v20 as s
          p=Path('results/t1_cache_v20.json'); p.parent.mkdir(exist_ok=True)
          p.write_text(json.dumps({'model':'V20_SAME_RUN_T1_CACHE','generated_at':datetime.now(timezone.utc).isoformat(),'entries':{'123':{'identity_ok':True,'canonical_url':'https://www.dba.dk/recommerce/forsale/item/123'}}}),encoding='utf-8')
          cache,age=s.load_same_run_cache(); assert '123' in cache and age is not None and age < 30
          p.unlink()
          print({'PASS':True,'cache_entries':len(cache),'age':age})
          PY
      - name: Dynamic retail discovery and same-product verification
        timeout-minutes: 7
        run: python dba_retail_prices_v20.py
      - name: Apply V20 to latest green DBA snapshot
        run: python dba_self_build_v20.py
      - name: Generate V20 report
        run: python dba_strategy_report_v20.py
      - name: Validate V20 focused gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('results/wow_strategy_latest.json').read_text(encoding='utf-8'))
          r=json.loads(Path('results/retail_prices_latest.json').read_text(encoding='utf-8'))
          rec=s.get('recommended_self_build') or {}
          assert s.get('model_version')=='DBA-WOW-SELF-BUILD-FIRST-V20'
          assert s.get('strategy_mode')=='V20_GPU_FIT_RAM_RETAIL_CACHE_BID'
          assert (s.get('component_market_coverage_v20') or {}).get('passed') is True
          assert str(rec.get('performance_class_v20') or '').startswith('SWEET SPOT'), rec.get('performance_class_v20')
          assert (s.get('gpu_optimizer_policy_v20') or {}).get('headline_minimum','').startswith('SWEET SPOT')
          value=s.get('value_foundation_build') or {}
          assert int(value.get('tcwp') or 10**9) <= int(rec.get('tcwp') or 0)
          assert r.get('model')=='V20_DYNAMIC_RETAIL_SAME_PRODUCT_GATE'
          assert r.get('all_catalog_products_verified') is True
          assert r.get('dynamic_discovery_gate_passed') is True
          assert int((r.get('counts') or {}).get('seed_ok') or 0)==int((r.get('counts') or {}).get('seed_total') or -1)>=5
          gi=rec.get('gpu_intelligence_v20') or {}
          assert (gi.get('utility') or {}).get('known') is True
          assert (gi.get('bid') or {}).get('walk_away') is not None
          assert rec.get('z20_fit_v20') in {'VERIFIED','LIKELY','UNKNOWN'}
          bids=s.get('bid_market_v20') or {}
          assert bids.get('GPU') and bids.get('CPU') and bids.get('RAM')
          pool=s.get('gpu_pool_v20') or {}
          text=Path('results/wow_self_build_report_v20.md').read_text(encoding='utf-8')
          for marker in ('SELF-BUILD FIRST V20','V20 — GPU value, Z20-fit og budmodel','V20 — RAM-bud og bridge-kontrol','V20 — dynamisk retail discovery','V20 — shared same-run T1-cache','V20 — GPU discovery-pool'):
              assert marker in text, marker
          print(json.dumps({'PASS':True,'recommended_tcwp':rec.get('tcwp'),'cpu':rec.get('cpu'),'gpu':rec.get('gpu'),'performance_class_v20':rec.get('performance_class_v20'),'value_foundation_tcwp':value.get('tcwp'),'value_foundation_gpu':value.get('gpu'),'z20_fit':rec.get('z20_fit_v20'),'gpu_action':(gi.get('bid') or {}).get('action'),'retail_counts':r.get('counts'),'gpu_pool':pool.get('family_counts')},ensure_ascii=False))
          PY
