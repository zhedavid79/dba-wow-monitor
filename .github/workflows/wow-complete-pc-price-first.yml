name: WoW Complete-PC Price-First

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 10 * * *'
    - cron: '0 17 * * *'
  push:
    branches: [main]
    paths:
      - 'wow_complete_pc_run_trigger.txt'
      - 'dba_browser_v2.py'
      - 'dba_browser_v3.py'
      - 'dba_browser_v4.py'
      - 'dba_browser_v5.py'
      - 'dba_browser_v6.py'
      - 'dba_browser_v6_recovery.py'
      - 'dba_browser_v7_intelligence.py'
      - 'dba_browser_v20.py'
      - 'dba_listing_intelligence.py'
      - 'dba_decision_report.py'
      - 'dba_t1_preflight.py'
      - 'dba_t1_schema_probe.py'
      - 'dba_t1_hydration_ancestor.py'
      - '.github/workflows/wow-complete-pc-price-first.yml'

permissions:
  contents: write

concurrency:
  group: wow-complete-pc-price-first
  cancel-in-progress: true

jobs:
  complete-pc-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install rendered DBA browser dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Compile complete-PC scanner
        run: |
          python -m py_compile \
            dba_browser_v2.py dba_browser_v3.py dba_browser_v4.py dba_browser_v5.py \
            dba_browser_v6.py dba_browser_v6_recovery.py dba_browser_v7_intelligence.py dba_browser_v20.py \
            dba_listing_intelligence.py dba_decision_report.py \
            dba_t1_preflight.py dba_t1_schema_probe.py dba_t1_hydration_ancestor.py

      - name: Verify DBA source/schema gate
        timeout-minutes: 3
        run: python dba_t1_preflight.py

      - name: Scan complete ready-to-use PCs and perform same-run T0/T1
        timeout-minutes: 20
        run: python dba_browser_v20.py

      - name: Build price-first decision report
        run: python dba_decision_report.py

      - name: Enforce complete-PC publication gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('results/wow_a3_latest.json')
          d = json.loads(p.read_text(encoding='utf-8'))

          def fail(msg):
              raise SystemExit('PRICE DATA GATE FAILED — ' + msg)

          if d.get('gate_passed') is not True:
              fail('gate_passed != true')
          if not str(d.get('model_version') or '').startswith('DBA-WOW-PRICE-FIRST-COMPLETE-PC-'):
              fail('wrong/non-complete-PC model_version')
          if (d.get('source_gate') or {}).get('ok') is not True:
              fail('source_gate.ok != true')
          if (d.get('price_binding_regression') or {}).get('ok') is not True:
              fail('historical price-binding fixture failed')

          cov = d.get('coverage') or {}
          dcov = cov.get('discovery') or {}
          tcov = cov.get('t1') or {}
          if dcov.get('complete') is not True:
              fail('discovery coverage incomplete')
          if tcov.get('complete') is not True:
              fail('T1 coverage incomplete')
          if int(tcov.get('candidate_completed') or 0) <= 0:
              fail('no T1 candidates completed')
          if int(tcov.get('candidate_completed') or 0) != int(tcov.get('candidate_total') or -1):
              fail('T1 candidate coverage mismatch')

          scope = str(d.get('scope') or '').lower()
          if 'complete ready-to-use' not in scope or 'no self-build' not in scope:
              fail('scope does not prove complete-PC-only mode')

          ranked = d.get('ranked') or []
          for i, r in enumerate(ranked, 1):
              lid = str(r.get('listing_id') or '')
              url = str(r.get('url') or '').rstrip('/')
              if not lid or not url.endswith('/' + lid):
                  fail(f'ranked row {i}: canonical URL/listing ID mismatch')
              if not isinstance(r.get('ask_t0'), int) or not isinstance(r.get('ask_t1'), int):
                  fail(f'ranked row {i}: non-numeric T0/T1 ASK')
              if not r.get('t0_source') or not r.get('t1_source'):
                  fail(f'ranked row {i}: missing T0/T1 retrieval source')
              if not r.get('t0_at') or not r.get('t1_at'):
                  fail(f'ranked row {i}: missing T0/T1 timestamps')
              status = str(r.get('status') or '').lower()
              if 'instock' not in status and status not in {'active', 'available'}:
                  fail(f'ranked row {i}: listing not objectively active')
              if r.get('performance_class') not in {'ACCEPTABLE', 'SWEET SPOT', 'OVERKILL'}:
                  fail(f'ranked row {i}: invalid performance class')

          dec = d.get('decision_summary') or {}
          if dec.get('self_build') is not False or dec.get('donor_builds') is not False or dec.get('component_procurement') is not False:
              fail('decision summary is not complete-PC-only')

          print(json.dumps({
              'publication_gate': True,
              'generated_at': d.get('generated_at'),
              'verified_t1_records': tcov.get('candidate_completed'),
              'ranked': len(ranked),
              'source_gate_listing': (d.get('source_gate') or {}).get('listing_id'),
          }, ensure_ascii=False))
          PY

      - name: Publish dedicated complete-PC snapshot
        run: |
          cp results/wow_a3_latest.json results/wow_complete_pc_latest.json
          cp results/wow_a3_report.md results/wow_complete_pc_report.md

      - name: Preserve complete-PC gated artifact
        uses: actions/upload-artifact@v4
        with:
          name: wow-complete-pc-${{ github.run_id }}
          retention-days: 3
          path: |
            results/wow_complete_pc_latest.json
            results/wow_complete_pc_report.md
            results/t1_cache_v20.json

      - name: Commit authoritative complete-PC snapshot
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/wow-complete-pc
          cp results/wow_complete_pc_latest.json results/wow_complete_pc_report.md /tmp/wow-complete-pc/
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/wow-complete-pc/* results/
            git add results/wow_complete_pc_latest.json results/wow_complete_pc_report.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update verified complete-PC price-first DBA report [skip ci]"
            if git push origin main; then exit 0; fi
          done
          exit 1
