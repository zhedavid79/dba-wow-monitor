name: Acurast DBA Verified Report

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. During Danish summer time (CEST),
    # 06:07-20:07 UTC corresponds to 08:07-22:07 local time.
    - cron: '7 6-20 * * *'
  push:
    branches: [main]
    paths:
      - 'acurast_dba_report.py'
      - 'acurast_dba_report_v2.py'
      - 'acurast_listing_quality.py'
      - 'acurast_valuation.py'
      - 'acurast_valuation_fixed.py'
      - 'acurastbot_probe.py'
      - 'acurastpulse_probe.py'
      - 'acurast_run_trigger.txt'
      - '.github/workflows/acurast-dba.yml'

permissions:
  contents: write

concurrency:
  group: acurast-dba-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Probe AcurastBot public device-data endpoints
        run: python acurastbot_probe.py

      - name: Probe Acurast Pulse Mainnet earnings
        run: python acurastpulse_probe.py

      - name: Build verified Acurast phone price report with retry
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "DBA verified report attempt $attempt/3"
            if python acurast_dba_report_v2.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "DBA verified report failed after 3 attempts"
          exit 1

      - name: Apply single-device price identity gate
        run: python acurast_listing_quality.py

      - name: Build Acurast procurement valuation
        run: python acurast_valuation_fixed.py

      - name: Validate publication contract
        run: |
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          latest = json.loads(Path('results/acurast_latest.json').read_text(encoding='utf-8'))
          valuation = json.loads(Path('results/acurast_valuation.json').read_text(encoding='utf-8'))

          assert latest.get('gate_passed') is True, 'DBA data gate is not PASS'
          assert latest.get('product_identity_gate') is True, 'Product identity gate is not PASS'
          assert int(latest.get('counts', {}).get('final_refetched', 0)) > 0, 'No final-refetched listings'
          assert valuation.get('valuation_gate') is True, 'Valuation gate is not PASS'
          assert valuation.get('dba_same_listing_gate') is True, 'Valuation same-listing gate is not PASS'

          # Reward integrity gate: only Mainnet chain-derived, deployment-neutral BASE is publishable.
          assert valuation.get('model_version') == 'V1.6-MAINNET-PULSE-BASELINE-AAE', 'Unexpected valuation model version'
          assert valuation.get('reward_data_gate') is True, 'Mainnet reward data gate is not PASS'
          reward = valuation.get('reward_source', {})
          assert reward.get('canary_acurastbot_used_for_absolute_acu') is False, 'Canary AcurastBot absolute reward path re-enabled'
          assert reward.get('old_cacu_to_acu_0_01_conversion_retired') is True, 'Retired cACU ×0.01 conversion detected'
          assert reward.get('old_partial_farm_scale_retired') is True, 'Retired partial-farm calibration detected'
          assert reward.get('base_is_deployment_neutral') is True, 'BASE is not deployment-neutral'
          coverage = float(reward.get('coverage') or 0)
          assert coverage >= 0.40, f'Mainnet Pulse reward coverage too low: {coverage:.1%}'
          ranked = valuation.get('ranked') or []
          assert ranked, 'No Mainnet Pulse-ranked listings'
          assert all(x.get('reward_source') == 'ACURAST_PULSE_MAINNET_CHAIN_DERIVED' for x in ranked), 'Mixed/unknown absolute reward source in ranked output'
          assert all(float(x.get('acu_epoch_base') or 0) > 0 for x in ranked), 'Non-positive BASE ACU/epoch in ranked output'
          assert all(float(x.get('acu_epoch_high') or 0) >= float(x.get('acu_epoch_base') or 0) for x in ranked), 'HIGH below BASE'
          assert all(float(x.get('pulse_observed_acu_epoch') or 0) >= float(x.get('acu_epoch_base') or 0) for x in ranked), 'BASE includes boost or exceeds observed epoch'

          latest_generated = latest.get('generated_at')
          valuation_generated = valuation.get('generated_at')
          assert latest_generated, 'Missing latest generated_at'
          assert valuation_generated, 'Missing valuation generated_at'

          latest_ts = datetime.fromisoformat(latest_generated.replace('Z', '+00:00'))
          valuation_ts = datetime.fromisoformat(valuation_generated.replace('Z', '+00:00'))
          now = datetime.now(timezone.utc)
          age = (now - latest_ts).total_seconds()
          skew = abs((valuation_ts - latest_ts).total_seconds())

          assert age < 1800, f'Result already stale at publication: {age:.0f}s'
          assert skew < 300, f'Latest/valuation generation skew too large: {skew:.0f}s'
          print(f'Publication contract PASS: {latest["counts"]["final_refetched"]} final listings, Pulse coverage={coverage:.1%}, age={age:.0f}s, generation_skew={skew:.0f}s')
          PY

      - name: Publish Acurast results
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/acurast-results
          cp results/acurast_latest.json /tmp/acurast-results/
          cp results/acurast_report.md /tmp/acurast-results/
          cp results/acurast_valuation.json /tmp/acurast-results/
          cp results/acurast_valuation.md /tmp/acurast-results/
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/acurast-results/* results/
            git add results/acurast_latest.json results/acurast_report.md results/acurast_valuation.json results/acurast_valuation.md
            if git diff --cached --quiet; then
              echo "No Acurast result changes"
              exit 0
            fi
            git commit -m "Update verified Acurast DBA report [skip ci]"
            if git push origin main; then exit 0; fi
            echo "Concurrent update detected; retrying ($attempt/3)"
            sleep 2
          done
          echo "Failed to publish Acurast results after 3 attempts"
          exit 1
