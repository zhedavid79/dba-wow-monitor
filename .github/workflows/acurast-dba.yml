name: Acurast DBA Verified Report

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'acurast_dba_report.py'
      - 'acurast_listing_quality.py'
      - 'acurast_valuation.py'
      - '.github/workflows/acurast-dba.yml'

permissions:
  contents: write

concurrency:
  group: acurast-dba-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Run shared DBA regression probe
        run: python dba_probe.py
      - name: Build verified Acurast phone price report
        run: python acurast_dba_report.py
      - name: Apply single-device price identity gate
        run: python acurast_listing_quality.py
      - name: Build Acurast procurement valuation
        run: python acurast_valuation.py
      - name: Commit Acurast results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/acurast_latest.json results/acurast_report.md results/acurast_valuation.json results/acurast_valuation.md
          if git diff --cached --quiet; then
            echo "No Acurast result changes"
          else
            git commit -m "Update verified Acurast DBA report [skip ci]"
            git reset --hard HEAD
            git clean -fd
            git pull --rebase origin main
            git push origin main
          fi
